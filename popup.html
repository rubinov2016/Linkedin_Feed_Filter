<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px/1.4 -apple-system, Segoe UI, Roboto, sans-serif; color: #1d252c; width: 240px; margin: 0; padding: 12px; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  label { display: flex; align-items: center; gap: 6px; margin: 6px 0; }
  .stats { color: #6b7280; margin: 8px 0; }
  button { display: block; width: 100%; margin: 6px 0; background: #1d252c; color: #fff; border: 0; border-radius: 6px; padding: 7px; cursor: pointer; }
  button.accent { background: #ffb70e; color: #1d252c; font-weight: 600; }
  button.secondary { background: #fff; color: #1d252c; border: 1px solid #d1d5db; }
  button:disabled { opacity: .5; cursor: default; }
  .note { color: #b42318; font-size: 12px; }
</style>
</head>
<body>
<h1>LinkedIn Feed Filter</h1>
<label><input type="checkbox" id="enabled"> Enabled</label>
<div class="stats" id="stats">–</div>
<button class="accent" id="condense">Load &amp; condense</button>
<button class="secondary" id="stop" style="display:none">Stop</button>
<button class="secondary" id="showAll">Show hidden posts</button>
<button class="secondary" id="reapply">Re-apply filters</button>
<button class="secondary" id="options">Settings…</button>
<div class="note" id="note"></div>
<script src="popup.js"></script>
</body>
</html>
